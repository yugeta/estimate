name: Generate template preview images

on:
  push:
    branches: ["main"]
    paths:
      - "public/templates/**/index.html"
      - "scripts/generate-template-previews.mjs"
      - ".github/workflows/template_preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Detect changed template HTML files
        id: detect
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git ls-files "public/templates/**/index.html")
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- "public/templates/**/index.html")
          fi

          {
            echo "files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Render preview images
        if: steps.detect.outputs.files != ''
        run: |
          printf "%s\n" "${{ steps.detect.outputs.files }}" > /tmp/changed_template_files.txt
          node scripts/generate-template-previews.mjs /tmp/changed_template_files.txt

      - name: Commit generated images
        if: steps.detect.outputs.files != ''
        run: |
          if git diff --quiet -- "public/template/images"; then
            echo "No image updates detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/template/images
          git commit -m "chore: update template preview images"
          git push origin main